name: update-pest-shards

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 1 * *'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  update-pest-shards:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.PR_AUTOMATION_CLIENT_ID }}
          private-key: ${{ secrets.PR_AUTOMATION_APP_PRIVATE_KEY }}

      - name: Prepare Laravel CI environment
        uses: ./.github/actions/laravel-ci-prepare
        with:
          build-assets: 'true'

      - name: Update shard timings
        run: composer test:update-shards
    
      - name: Create pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: 'chore: update Pest shard timings'
          branch: 'chore/update-pest-shards'
          delete-branch: true
          title: 'chore: update Pest shard timings'
          body: |
            Monthly automated update for `tests/.pest/shards.json`.
            
            This keeps Pest test sharding time-balanced for CI jobs.
          add-paths: |
            tests/.pest/shards.json
