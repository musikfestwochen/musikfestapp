name: Deploy and Seed Laravel App

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.junie/**'
      - '.run/**'
      - 'docs/**'
      - 'overrides/**'
      - '.github/**'
      - 'mkdocs.yml'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.ai/**'
      - 'docker-compose.yml'
      - 'Dockerfile'
      - '**/*.md'
      - 'tests/**'
      - 'e2e/**'
      - 'playwright-report/**'
      - 'test-results/**'
  workflow_dispatch:

permissions:
  # Minimum permissions required for deployment:
  contents: read # To read repository contents
  deployments: write # To update deployment status
  id-token: write # Needed for authentication during deployment

jobs:
  lint:
    uses: ./.github/workflows/lint.yml
    secrets: inherit
    permissions:
      contents: write # Allow the linter to commit changes if needed

  tests:
    uses: ./.github/workflows/tests.yml
    secrets: inherit

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: [lint, tests]
    environment: Production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Prepare deployment environment
        uses: ./.github/actions/laravel-ci-prepare
        with:
          coverage: 'none'
          install-php-dependencies: 'false'
          bootstrap-laravel: 'false'
          create-sqlite-database: 'false'
          publish-ziggy: 'false'
          node-install-command: 'npm clean-install'
          build-assets: 'true'

      # Deploy built assets without scp-action's remote OS autodetection.
      - name: Deploy built assets
        env:
          SSH_HOST: ${{ secrets.INFOMANIAK_SSH_SERVER }}
          SSH_USER: ${{ secrets.INFOMANIAK_SSH_USER }}
          SSH_PASSWORD: ${{ secrets.INFOMANIAK_SSH_PASSWORD }}
          APP_PATH: /home/clients/58c2b2f1ec280a97dfe624b840e761b7/sites/musikfestapp
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

          export SSHPASS="$SSH_PASSWORD"

          tar -czf - public/build | sshpass -e ssh \
            -o StrictHostKeyChecking=no \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            "$SSH_USER@$SSH_HOST" \
            "APP_PATH='$APP_PATH' bash -lc 'rm -rf \"\$APP_PATH/public/build\" && mkdir -p \"\$APP_PATH/public\" && tar -xzf - -C \"\$APP_PATH\"'"

      # SSH into the server and finalize the deployment
      - name: Run Laravel deployment commands on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.INFOMANIAK_SSH_SERVER }}
          username: ${{ secrets.INFOMANIAK_SSH_USER }}
          password: ${{ secrets.INFOMANIAK_SSH_PASSWORD }}
          script: |
            set -e  # Exit immediately if any command fails

            echo "Starting Deployment"

            PHP_BIN="/opt/php8.4/bin/php"
            COMPOSER_BIN="/opt/php8.4/bin/composer"
            APP_PATH="/home/clients/58c2b2f1ec280a97dfe624b840e761b7/sites/musikfestapp"

            cd "$APP_PATH"

            if $PHP_BIN artisan down --refresh=15; then
              echo "Application in maintenance mode."
            else
              echo "Failed to put application in maintenance mode. Continuing deployment..."
            fi

            echo "Fetching latest changes from the repository..."
            git fetch origin main || { echo "Git fetch failed! Exiting."; exit 1; }
            git reset --hard origin/main || { echo "Git reset to origin/main failed! Exiting."; exit 1; }

            echo "Decrypting environment file..."
            $PHP_BIN artisan env:decrypt --env=production --key=${{ secrets.ENV_PRODUCTION_KEY_2 }} --force --filename=new-env || { echo "Environment decryption failed! Exiting."; exit 1; }

            echo "Removing other environment files..."
            rm -f .env* || { echo "Failed to remove old environment files! Exiting."; exit 1; }

            echo "Renaming decrypted environment file..."
            mv new-env .env || { echo "Failed to rename decrypted environment file! Exiting."; exit 1; }

            echo "Creating also the .production file..."
            cp .env .env.production || { echo "Failed to create .production file! Exiting ."; exit 1; }

            echo "Installing PHP dependencies on the server..."
            $COMPOSER_BIN install --no-dev --optimize-autoloader || { echo "Composer install failed! Exiting."; exit 1; }

            echo "Running database migrations..."
            $PHP_BIN artisan migrate --force || { echo "Migrations failed! Exiting."; exit 1; }

            echo "Seeding the Role and Permission tables..."
            $PHP_BIN artisan db:seed --force --class=RolesAndPermissionsSeeder || { echo "Seeding failed! Exiting."; exit 1; }

            echo "Optimizing application..."
            $PHP_BIN artisan optimize:clear || { echo "Optimization failed! Exiting."; exit 1; }
            $PHP_BIN artisan optimize || { echo "Optimization failed! Exiting."; exit 1; }

            echo "Generating Ziggy routes..."
            $PHP_BIN artisan ziggy:generate || { echo "Ziggy generation failed! Exiting."; exit 1; }

      - name: Bring the application back online
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.INFOMANIAK_SSH_SERVER }}
          username: ${{ secrets.INFOMANIAK_SSH_USER }}
          password: ${{ secrets.INFOMANIAK_SSH_PASSWORD }}
          script: |
            set -e  # Exit immediately if any command fails

            cd /home/clients/58c2b2f1ec280a97dfe624b840e761b7/sites/musikfestapp

            echo "Bringing application back online..."
            /opt/php8.4/bin/php artisan up

            echo "Deployment complete!"
