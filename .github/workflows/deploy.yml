name: Deploy Laravel App

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Node.js and Dependencies
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci # Use 'ci' for a clean install based on package-lock.json

      - name: Build assets
        run: npm run build

      - name: Deploy built assets to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.INFOMANIAK_SSH_SERVER }}
          username: ${{ secrets.INFOMANIAK_SSH_USER }}
          password: ${{ secrets.INFOMANIAK_SSH_PASSWORD }}
          source: 'public/build'
          target: '/home/clients/58c2b2f1ec280a97dfe624b840e761b7/sites/musikfestapp/public'

      - name: Connect to server and deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.INFOMANIAK_SSH_SERVER }}
          username: ${{ secrets.INFOMANIAK_SSH_USER }}
          password: ${{ secrets.INFOMANIAK_SSH_PASSWORD }}
          script: |
            set -e  # Exit immediately if any command fails

            echo "Starting Deployment"

            PHP_BIN="/opt/php8.4/bin/php"
            COMPOSER_BIN="/opt/php8.4/bin/composer"

            cd /home/clients/58c2b2f1ec280a97dfe624b840e761b7/sites/musikfestapp

            if $PHP_BIN artisan down; then
              echo "Application in maintenance mode."
            else
              echo "Failed to put application in maintenance mode. Continuing deployment..."
            fi

            git reset --hard
            git pull origin main || { echo "Git pull failed! Exiting."; exit 1; }

            echo "Installing dependencies..."
            $COMPOSER_BIN install --no-dev --optimize-autoloader || { echo "Composer install failed! Exiting."; exit 1; }

            echo "Running migrations..."
            $PHP_BIN artisan migrate --force || { echo "Migrations failed! Exiting."; exit 1; }

            echo "Optimizing application..."
            $PHP_BIN artisan optimize || { echo "Optimization failed! Exiting."; exit 1; }

            $PHP_BIN artisan up || { echo "Failed to bring the application online! Exiting."; exit 1; }

            echo "Deployment Completed Successfully"
