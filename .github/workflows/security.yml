name: security

on:
  pull_request:
    paths-ignore:
      - '.junie/**'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  merge_group:
    branches:
      - main
    types:
      - checks_requested
  push:
    branches:
      - main
    paths-ignore:
      - '.junie/**'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  schedule:
    - cron: '35 4 * * 2'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lockfile-consistency:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Prepare lockfile verification environment
        uses: ./.github/actions/laravel-ci-prepare
        with:
          coverage: 'none'
          install-php-dependencies: 'false'
          install-node-dependencies: 'false'
          bootstrap-laravel: 'false'
          create-sqlite-database: 'false'
          publish-ziggy: 'false'

      - name: Validate lockfile consistency
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "merge_group" ]; then
            BASE_SHA="${{ github.event.merge_group.base_sha }}"
            HEAD_SHA="${{ github.event.merge_group.head_sha }}"
          else
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.sha }}"
          fi

          CHANGED_FILES="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"

          file_changed() {
            printf '%s\n' "$CHANGED_FILES" | grep -qx "$1"
          }

          if file_changed "package.json" && ! file_changed "package-lock.json"; then
            echo "package.json changed without package-lock.json. Verifying lockfile via npm..."
            npm install --package-lock-only --ignore-scripts

            if ! git diff --quiet -- package-lock.json; then
              echo "package-lock.json is out of date for package.json changes."
              echo "Run 'npm install' and commit package-lock.json."
              exit 1
            fi
          fi

          if file_changed "composer.json" && ! file_changed "composer.lock"; then
            echo "composer.json changed without composer.lock. Verifying lockfile via composer..."
            composer install --no-interaction --prefer-dist --dry-run --no-scripts
          fi

          echo "Lockfile consistency check passed."

  composer-audit:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare PHP environment
        uses: ./.github/actions/laravel-ci-prepare
        with:
          coverage: 'none'
          install-php-dependencies: 'false'
          install-node-dependencies: 'false'
          bootstrap-laravel: 'false'
          create-sqlite-database: 'false'
          publish-ziggy: 'false'

      - name: Validate composer files
        run: composer validate --strict --no-check-publish

      - name: Audit Composer advisories (fail on medium+)
        run: |
          set -euo pipefail
          composer audit --locked --format=json --no-interaction > composer-audit.json || true
          php -r '$data = json_decode(file_get_contents("composer-audit.json"), true); if (!is_array($data)) { fwrite(STDERR, "Failed to parse composer audit JSON\n"); exit(1);} $fail = false; foreach (($data["advisories"] ?? []) as $package => $advisories) { foreach ($advisories as $advisory) { $severity = strtolower((string) ($advisory["severity"] ?? "unknown")); if (in_array($severity, ["medium", "high", "critical"], true)) { $id = $advisory["advisoryId"] ?? ($advisory["cve"] ?? "unknown"); fwrite(STDERR, sprintf("[%s] %s (%s)\n", $severity, $package, $id)); $fail = true; } } } if ($fail) { exit(1);} echo "No medium/high/critical Composer advisories found.\n";'

  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare Node environment
        uses: ./.github/actions/laravel-ci-prepare
        with:
          coverage: 'none'
          install-php-dependencies: 'false'
          bootstrap-laravel: 'false'
          create-sqlite-database: 'false'
          publish-ziggy: 'false'

      - name: Audit npm advisories (fail on high+)
        run: npm audit --audit-level=high
