name: tests

on:
  pull_request:
    paths-ignore:
      - '.junie/**'
      - 'docs/**'
      - 'overrides/**'
      - 'mkdocs.yml'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/ISSUE_TEMPLATE/**'
  merge_group:
    branches:
      - main
    types:
      - checks_requested
  workflow_call:
  workflow_dispatch:

permissions:
  # Only read access to repository contents is needed for running tests
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare Laravel CI environment
        uses: ./.github/actions/laravel-ci-prepare
        with:
          build-assets: 'true'

      - name: Run Vitest
        run: composer test:frontend
        env:
          LARAVEL_BYPASS_ENV_CHECK: 1

      - name: TypeScript Check
        run: composer test:frontend:types

      - name: SCA Tests
        run: composer test:sca

      - name: Pest Coverage Tests
        run: composer test:coverage:ci

      - name: Type Coverage Tests
        run: composer test:types:ci

  mariadb-migration-tests:
    uses: ./.github/workflows/mariadb-migration-tests.yml
    secrets: inherit

  e2e-tests:
    runs-on: ubuntu-latest
    services:
      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025
          - 8025:8025
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare Laravel CI environment
        uses: ./.github/actions/laravel-ci-prepare
        with:
          install-playwright: 'true'
          coverage: 'none'
          build-assets: 'true'

      - name: Start Laravel Server
        run: php artisan serve --port=8000 &
        env:
          APP_URL: http://localhost:8000
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite

      - name: Run E2E Tests
        run: composer test:e2e:ci
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:8000
          CI: true

      - name: Upload Playwright Test Artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7
