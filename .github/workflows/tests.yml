name: tests

on:
  pull_request:
    paths-ignore:
      - '.junie/**'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  merge_group:
    branches:
      - main
    types:
      - checks_requested
  workflow_call:
  workflow_dispatch:

permissions:
  # Only read access to repository contents is needed for running tests
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  basic-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          tools: composer:v2
          coverage: xdebug

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: vendor
          key: composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            composer-

      - name: Install Node Dependencies
        run: npm i

      - name: Create SQLite Database
        run: touch database/database.sqlite

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy Environment File
        run: cp .env.local .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Publish Ziggy Configuration
        run: php artisan ziggy:generate

      - name: Build Assets
        run: npm run build

      - name: Upload Built Assets
        uses: actions/upload-artifact@v7
        with:
          name: built-assets
          path: public/build

      - name: Run Vitest
        run: npx vitest run
        env:
          LARAVEL_BYPASS_ENV_CHECK: 1

      - name: SCA Tests
        run: ./vendor/bin/phpstan analyse

      - name: Pest Tests
        run: ./vendor/bin/pest --ci --parallel

      - name: Type Coverage Tests
        run: ./vendor/bin/pest --type-coverage

  mariadb-migration-tests:
    needs: basic-tests
    uses: ./.github/workflows/mariadb-migration-tests.yml
    secrets: inherit

  coverage-tests:
    runs-on: ubuntu-latest
    needs: basic-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          tools: composer:v2
          coverage: xdebug

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: vendor
          key: composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            composer-

      - name: Install Node Dependencies
        run: npm i

      - name: Create SQLite Database
        run: touch database/database.sqlite

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy Environment File
        run: cp .env.local .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Publish Ziggy Configuration
        run: php artisan ziggy:generate

      - name: Download Built Assets
        uses: actions/download-artifact@v8
        with:
          name: built-assets
          path: public/build

      - name: Run Coverage Tests
        run: ./vendor/bin/pest --coverage --min=100 --parallel

  mutation-tests:
    runs-on: ubuntu-latest
    needs: basic-tests
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    name: Mutation Tests (Shard ${{ matrix.shard }}/4)
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          tools: composer:v2
          coverage: xdebug

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: vendor
          key: composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            composer-

      - name: Install Node Dependencies
        run: npm i

      - name: Create SQLite Database
        run: touch database/database.sqlite

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy Environment File
        run: cp .env.local .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Publish Ziggy Configuration
        run: php artisan ziggy:generate

      - name: Download Built Assets
        uses: actions/download-artifact@v8
        with:
          name: built-assets
          path: public/build

      - name: Run Mutation Tests
        run: ./vendor/bin/pest --mutate --min=100 --ignore-min-score-on-zero-mutations --parallel --covered-only --shard=${{ matrix.shard }}/4

  e2e-tests:
    runs-on: ubuntu-latest
    needs: basic-tests
    services:
      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025
          - 8025:8025
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          tools: composer:v2
          coverage: xdebug

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: vendor
          key: composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            composer-

      - name: Install Node Dependencies
        run: npm i

      - name: Install Playwright Browsers
        run: npx playwright install chromium webkit --with-deps

      - name: Create SQLite Database
        run: touch database/database.sqlite

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy Environment File
        run: cp .env.local .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Publish Ziggy Configuration
        run: php artisan ziggy:generate

      - name: Download Built Assets
        uses: actions/download-artifact@v8
        with:
          name: built-assets
          path: public/build

      - name: Start Laravel Server
        run: php artisan serve --port=8000 &
        env:
          APP_URL: http://localhost:8000
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite

      - name: Run E2E Tests
        run: npx playwright test
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:8000
          CI: true

      - name: Upload Playwright Test Artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7
