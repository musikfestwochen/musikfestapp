name: Deploy Documentation

on:
  pull_request:
    paths:
      - docs/**
      - overrides/**
      - mkdocs.yml
      - pyproject.toml
      - uv.lock
      - app/Models/**
      - database/migrations/**
      - config/database.php
      - composer.json
      - composer.lock
      - .github/workflows/docs-pages.yml
  push:
    branches:
      - main
    paths:
      - docs/**
      - overrides/**
      - mkdocs.yml
      - pyproject.toml
      - uv.lock
      - .github/workflows/docs-pages.yml
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  docs-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Prepare docs environment
        uses: ./.github/actions/docs-prepare

      - name: Auto-commit regenerated ERD
        if: github.event.pull_request.head.repo.fork == false
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          file_pattern: docs/diagrams/erd.md
          commit_message: 'chore(docs): regenerate ERD'

      - name: Build docs site
        run: uv run mkdocs build --strict

  build:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare docs environment
        uses: ./.github/actions/docs-prepare

      - name: Build docs site
        run: uv run mkdocs build --strict

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    if: github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
