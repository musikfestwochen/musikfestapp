name: linter

on:
  pull_request:
  workflow_call:

permissions:
  # Write permission is required for auto-formatting and committing linting fixes
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y aspell aspell-en
          composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
          npm ci

      - name: Run Rector
        run: vendor/bin/rector --dry-run

      - name: Run Pint
        run: vendor/bin/pint

      - name: Format Frontend
        run: npm run format

      - name: Lint Frontend
        run: npm run lint

      - name: Run Typos Check
        run: vendor/bin/peck

      - name: Ignore package-lock auto-format changes
        run: git restore --source=HEAD --worktree --staged package-lock.json

      - name: Commit Changes
        if: github.event_name == 'pull_request'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: fix code style
          commit_options: '--no-verify'
