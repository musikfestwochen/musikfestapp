name: linter

on:
  pull_request:
    paths-ignore:
      - '.junie/**'
      - 'docs/**'
      - 'overrides/**'
      - 'mkdocs.yml'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/ISSUE_TEMPLATE/**'
  merge_group:
    branches:
      - main
    types:
      - checks_requested
  workflow_call:

permissions:
  # Write permission is required for auto-formatting and committing linting fixes
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y aspell aspell-en
          composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
          npm i

      - name: Run Rector
        run: vendor/bin/rector --dry-run

      - name: Run Pint
        run: |
          if [ "${{ github.event_name }}" = "merge_group" ]; then
            vendor/bin/pint --test
          else
            vendor/bin/pint
          fi

      - name: Format Frontend
        run: |
          if [ "${{ github.event_name }}" = "merge_group" ]; then
            npm run format:check
          else
            npm run format
          fi

      - name: Lint Frontend
        run: |
          if [ "${{ github.event_name }}" = "merge_group" ]; then
            npx eslint .
          else
            npm run lint
          fi

      - name: Run Typos Check
        run: vendor/bin/peck

      - name: Ignore package-lock auto-format changes
        run: git restore --source=HEAD --worktree --staged package-lock.json

      - name: Commit Changes
        if: github.event_name == 'pull_request'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: fix code style
          commit_options: '--no-verify'
