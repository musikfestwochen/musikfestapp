services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
            args:
                PHP_VERSION: "8.4"
        image: musikfestapp/php-app:dev
        container_name: musikfestapp_app
        working_dir: /var/www/html
        environment:
            COMPOSER_ALLOW_SUPERUSER: "1"
        volumes:
            - .:/var/www/html:cached               # your code
            - composer-cache:/tmp/composer:rw      # composer cache (kept)
            - vendor:/var/www/html/vendor          # fast vendor (incl. pestphp cache)
            - phpstan-cache:/tmp/phpstan           # persistent phpstan cache
        tty: true
        stdin_open: true

    node:
        image: node:22
        container_name: musikfestapp_node
        working_dir: /var/www/html
        volumes:
            - .:/var/www/html:cached
            - node_modules:/var/www/html/node_modules  # fast node_modules
        tty: true
        stdin_open: true

    mariadb:
        image: mariadb:lts
        container_name: musikfestapp_mariadb
        profiles:
            - benchmark
        environment:
            MARIADB_ROOT_PASSWORD: password
            MARIADB_DATABASE: musikfestapp_benchmark
        ports:
            - "3306:3306"
        volumes:
            - mariadb-data:/var/lib/mysql
        healthcheck:
            test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
            interval: 10s
            timeout: 5s
            retries: 3

volumes:
    composer-cache:
        name: musikfestapp_composer_cache
    vendor:
        name: musikfestapp_vendor
    node_modules:
        name: musikfestapp_node_modules
    phpstan-cache:
        name: musikfestapp_phpstan_cache
    mariadb-data:
        name: musikfestapp_mariadb_data
