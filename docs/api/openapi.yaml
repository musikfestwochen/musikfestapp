openapi: 3.1.0
info:
    title: Musikfestapp Sensor Ingestion API
    version: 1.0.0
    description: |
        HTTP contracts used by sensors and sensor bridges to submit measurements.

        All requests must use JSON and include `Accept: application/json`. Authentication
        tokens identify the sensor that owns submitted measurements.
servers:
    - url: /api
      description: Current Musikfestapp installation
tags:
    - name: Peoplecount
      description: People-counting sensor ingestion.
    - name: Stage Safety
      description: Stage safety sensor ingestion.
paths:
    /peoplecount/interval-count:
        post:
            tags:
                - Peoplecount
            summary: Submit Axis people-count intervals
            operationId: submitPeoplecountIntervalCount
            description: |
                Submits one or more Axis people-count measurements for the sensor identified
                by the bearer token. The payload serial must match that sensor.

                Measurements are upserted by sensor and interval. Replaying an interval updates
                its receipt time and counts and still returns `201`. The response `count` is the
                number of recognized measurements, not the number of newly inserted rows.
            security:
                - sensorToken: []
            parameters:
                - $ref: '#/components/parameters/AcceptJson'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/AxisIntervalCountRequest'
                        examples:
                            interval:
                                summary: One-minute interval
                                value:
                                    apiName: Axis Retail Data
                                    apiVersion: '0.4'
                                    sensor:
                                        serial: AXIS-TEST-001
                                    data:
                                        measurements:
                                            - kind: people-counts
                                              utcFrom: '2026-07-17T11:59:00Z'
                                              utcTo: '2026-07-17T12:00:00Z'
                                              items:
                                                  - direction: in
                                                    count: 5
                                                  - direction: out
                                                    count: 3
            responses:
                '200':
                    description: Payload contained no recognized measurements.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/NoMeasurementsResponse'
                '201':
                    description: One or more measurements were processed.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PeoplecountProcessedResponse'
                '400':
                    description: Payload could not be processed.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ProcessingFailureResponse'
                '401':
                    $ref: '#/components/responses/Unauthenticated'
    /stage-safety/readings:
        post:
            tags:
                - Stage Safety
            summary: Submit a BW-WSS wind reading
            operationId: submitStageSafetyReading
            description: |
                This contract defines the integration boundary for the Raspberry Pi bridge.
                The bearer token identifies one physical Stage Safety sensor and must have the
                `stage-safety:readings:create` ability. The payload serial is a consistency check.

                Successful requests are idempotently upserted by sensor and observation time.
                Wind values are normalized to metres per second by the application.
            security:
                - sensorToken: []
            parameters:
                - $ref: '#/components/parameters/AcceptJson'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/BroadweighWindReadingRequest'
                        examples:
                            reading:
                                summary: BW-WSS average and three-second gust
                                value:
                                    schema_version: 1
                                    sensor_serial: BW12345
                                    observed_at: '2026-07-17T12:00:00Z'
                                    payload:
                                        average: 8.2
                                        gust: 12.7
                                        gust_period_seconds: 3
                                        unit: m/s
            responses:
                '200':
                    description: Reading was processed or idempotently updated.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/StageSafetyProcessedResponse'
                '401':
                    $ref: '#/components/responses/Unauthenticated'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '422':
                    $ref: '#/components/responses/InvalidPayload'
                '429':
                    $ref: '#/components/responses/RateLimited'
                '500':
                    $ref: '#/components/responses/ServerError'
components:
    securitySchemes:
        sensorToken:
            type: http
            scheme: bearer
            bearerFormat: Sanctum
            description: API token issued to one physical sensor.
    parameters:
        AcceptJson:
            name: Accept
            in: header
            required: true
            description: Ensures authentication and error responses use JSON rather than browser redirects.
            schema:
                type: string
                const: application/json
    schemas:
        AxisIntervalCountRequest:
            type: object
            additionalProperties: true
            required:
                - apiName
                - apiVersion
                - sensor
                - data
            properties:
                apiName:
                    type: string
                    const: Axis Retail Data
                apiVersion:
                    type: string
                    const: '0.4'
                sensor:
                    $ref: '#/components/schemas/AxisSensorIdentity'
                data:
                    $ref: '#/components/schemas/AxisMeasurementData'
        AxisSensorIdentity:
            type: object
            additionalProperties: true
            required:
                - serial
            properties:
                serial:
                    type: string
                    minLength: 1
                    description: Must exactly match the sensor associated with the bearer token.
        AxisMeasurementData:
            type: object
            additionalProperties: true
            required:
                - measurements
            properties:
                utcFrom:
                    type: string
                    format: date-time
                    deprecated: true
                    description: Accepted for Axis compatibility but ignored. Use measurement timestamps.
                utcTo:
                    type: string
                    format: date-time
                    deprecated: true
                    description: Accepted for Axis compatibility but ignored. Use measurement timestamps.
                measurements:
                    type: array
                    items:
                        $ref: '#/components/schemas/AxisPeopleCountMeasurement'
        AxisPeopleCountMeasurement:
            type: object
            additionalProperties: true
            required:
                - kind
                - utcFrom
                - utcTo
                - items
            properties:
                kind:
                    type: string
                    const: people-counts
                utcFrom:
                    $ref: '#/components/schemas/TimestampWithTimezone'
                utcTo:
                    $ref: '#/components/schemas/TimestampWithTimezone'
                items:
                    type: array
                    description: If one direction occurs more than once, the last value is used.
                    items:
                        $ref: '#/components/schemas/AxisPeopleCountItem'
        AxisPeopleCountItem:
            type: object
            additionalProperties: true
            required:
                - direction
                - count
            properties:
                direction:
                    type: string
                    enum:
                        - in
                        - out
                count:
                    type: integer
                    minimum: 0
                    maximum: 65535
        TimestampWithTimezone:
            type: string
            format: date-time
            pattern: '(?:Z|[+-]\d{2}:?\d{2})$'
            description: RFC 3339 timestamp with `Z` or an explicit numeric UTC offset.
        PeoplecountProcessedResponse:
            type: object
            additionalProperties: false
            required:
                - message
                - count
            properties:
                message:
                    type: string
                    const: Interval count data processed successfully.
                count:
                    type: integer
                    minimum: 1
                    description: Number of recognized measurements before interval deduplication.
        NoMeasurementsResponse:
            type: object
            additionalProperties: false
            required:
                - message
            properties:
                message:
                    type: string
                    const: No interval count data to process.
        ProcessingFailureResponse:
            type: object
            additionalProperties: false
            required:
                - error
                - message
            properties:
                error:
                    type: string
                    const: Processing failed
                message:
                    type: string
        BroadweighWindReadingRequest:
            type: object
            additionalProperties: false
            required:
                - schema_version
                - sensor_serial
                - observed_at
                - payload
            properties:
                schema_version:
                    type: integer
                    const: 1
                sensor_serial:
                    type: string
                    minLength: 1
                    description: Must exactly match the sensor associated with the bearer token.
                observed_at:
                    $ref: '#/components/schemas/TimestampWithTimezone'
                payload:
                    $ref: '#/components/schemas/BroadweighWindPayload'
        BroadweighWindPayload:
            type: object
            additionalProperties: false
            required:
                - average
                - gust
                - gust_period_seconds
                - unit
            properties:
                average:
                    type: number
                    minimum: 0
                    description: Average wind speed expressed in `unit`.
                gust:
                    type: number
                    minimum: 0
                    description: Peak gust speed over `gust_period_seconds`, expressed in `unit`.
                gust_period_seconds:
                    type: integer
                    enum:
                        - 1
                        - 3
                        - 5
                        - 10
                unit:
                    type: string
                    enum:
                        - m/s
                        - km/h
                        - mph
                        - fps
        StageSafetyProcessedResponse:
            type: object
            additionalProperties: false
            required:
                - message
                - count
            properties:
                message:
                    type: string
                    const: Wind readings processed successfully.
                count:
                    type: integer
                    const: 2
                    description: Average and gust readings processed from the payload.
        MessageResponse:
            type: object
            additionalProperties: false
            required:
                - message
            properties:
                message:
                    type: string
        ValidationErrorResponse:
            type: object
            additionalProperties: false
            required:
                - message
                - errors
            properties:
                message:
                    type: string
                errors:
                    type: object
                    additionalProperties:
                        type: array
                        items:
                            type: string
    responses:
        Unauthenticated:
            description: Bearer token is missing, invalid, expired, or revoked.
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/MessageResponse'
                    example:
                        message: Unauthenticated.
        Forbidden:
            description: Token lacks the required ability or the sensor is archived.
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/MessageResponse'
                    example:
                        message: This action is unauthorized.
        InvalidPayload:
            description: Request structure, sensor identity, or reading value is invalid.
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ValidationErrorResponse'
        RateLimited:
            description: Sensor submitted too many requests.
            headers:
                Retry-After:
                    description: Seconds until another request may be attempted.
                    schema:
                        type: integer
                        minimum: 0
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/MessageResponse'
                    example:
                        message: Too Many Attempts.
        ServerError:
            description: Unexpected server failure. Accepted readings are not reported as successful.
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/MessageResponse'
                    example:
                        message: Server Error
